<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Настройки превью для WhatsApp -->
    <title>Каталог бытовой химии, духов в Петропавловске</title>
    <meta name="description" content="Каталог бытовой химии и парфюмерии Мама Знает в Петропавловске.">

    <!-- Open Graph метатеги -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Каталог бытовой химии, духов в Петропавловске">
    <meta property="og:description" content="Официальный каталог бытовой химии, парфюмерии и товаров для дома Мама Знает.">
    <meta property="og:image" content="https://suleimanbender-byte.github.io/katalog_1/page1.jpg">
    <meta property="og:image:type" content="image/jpeg">

    <!-- Подключаем jQuery и Turn.js для ПК -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2c1d11 0%, #1a1008 100%);
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* --- МОБИЛЬНАЯ ВЕРСИЯ (Слайдер) --- */
        .mobile-slider {
            width: 100%;
            max-width: 450px;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .mobile-slider::-webkit-scrollbar {
            display: none; /* Скрываем полосу прокрутки */
        }

        .mobile-slide {
            flex: 0 0 100%;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .mobile-slide img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        /* --- ДЕСКТОПНАЯ ВЕРСИЯ (Книга Turn.js) --- */
        .desktop-catalog {
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 8px;
        }

        #flipbook {
            width: 900px;
            height: 600px;
        }

        #flipbook .page {
            width: 450px;
            height: 600px;
            background-color: #ffffff;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- КНОПКИ УПРАВЛЕНИЯ --- */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            z-index: 100;
        }

        .controls button {
            background: linear-gradient(135deg, #8c6d53 0%, #684c35 100%);
            color: #ffffff;
            border: 1px solid #aa8769;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Показываем книжную версию только на больших экранах */
        @media (min-width: 769px) {
            .mobile-slider {
                display: none;
            }
            .desktop-catalog {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- Мобильный вариант (каждая страница строго по центру экрана) -->
        <div class="mobile-slider" id="mobileSlider">
            <div class="mobile-slide"><img src="page1.jpg" alt="Страница 1"></div>
            <div class="mobile-slide"><img src="page2.jpg" alt="Страница 2"></div>
            <div class="mobile-slide"><img src="page3.jpg" alt="Страница 3"></div>
            <div class="mobile-slide"><img src="page4.jpg" alt="Страница 4"></div>
            <div class="mobile-slide"><img src="page5.jpg" alt="Страница 5"></div>
            <div class="mobile-slide"><img src="page6.jpg" alt="Страница 6"></div>
            <div class="mobile-slide"><img src="page7.jpg" alt="Страница 7"></div>
            <div class="mobile-slide"><img src="page8.jpg" alt="Страница 8"></div>
            <div class="mobile-slide"><img src="page9.jpg" alt="Страница 9"></div>
            <div class="mobile-slide"><img src="page10.jpg" alt="Страница 10"></div>
            <div class="mobile-slide"><img src="page11.jpg" alt="Страница 11"></div>
            <div class="mobile-slide"><img src="page12.jpg" alt="Страница 12"></div>
            <div class="mobile-slide"><img src="page13.jpg" alt="Страница 13"></div>
            <div class="mobile-slide"><img src="page14.jpg" alt="Страница 14"></div>
            <div class="mobile-slide"><img src="page15.jpg" alt="Страница 15"></div>
            <div class="mobile-slide"><img src="page16.jpg" alt="Страница 16"></div>
            <div class="mobile-slide"><img src="page17.jpg" alt="Страница 17"></div>
            <div class="mobile-slide"><img src="page18.jpg" alt="Страница 18"></div>
            <div class="mobile-slide"><img src="page19.jpg" alt="Страница 19"></div>
            <div class="mobile-slide"><img src="page20.jpg" alt="Страница 20"></div>
        </div>

        <!-- ПК вариант (интерактивная книга) -->
        <div class="desktop-catalog">
            <div id="flipbook">
                <div class="page"><img src="page1.jpg" alt="Страница 1"></div>
                <div class="page"><img src="page2.jpg" alt="Страница 2"></div>
                <div class="page"><img src="page3.jpg" alt="Страница 3"></div>
                <div class="page"><img src="page4.jpg" alt="Страница 4"></div>
                <div class="page"><img src="page5.jpg" alt="Страница 5"></div>
                <div class="page"><img src="page6.jpg" alt="Страница 6"></div>
                <div class="page"><img src="page7.jpg" alt="Страница 7"></div>
                <div class="page"><img src="page8.jpg" alt="Страница 8"></div>
                <div class="page"><img src="page9.jpg" alt="Страница 9"></div>
                <div class="page"><img src="page10.jpg" alt="Страница 10"></div>
                <div class="page"><img src="page11.jpg" alt="Страница 11"></div>
                <div class="page"><img src="page12.jpg" alt="Страница 12"></div>
                <div class="page"><img src="page13.jpg" alt="Страница 13"></div>
                <div class="page"><img src="page14.jpg" alt="Страница 14"></div>
                <div class="page"><img src="page15.jpg" alt="Страница 15"></div>
                <div class="page"><img src="page16.jpg" alt="Страница 16"></div>
                <div class="page"><img src="page17.jpg" alt="Страница 17"></div>
                <div class="page"><img src="page18.jpg" alt="Страница 18"></div>
                <div class="page"><img src="page19.jpg" alt="Страница 19"></div>
                <div class="page"><img src="page20.jpg" alt="Страница 20"></div>
            </div>
        </div>

        <!-- Кнопки навигации -->
        <div class="controls">
            <button id="prev">◄ Назад</button>
            <button id="next">Вперед ►</button>
        </div>

    </div>

    <script>
        $(document).ready(function() {
            var isMobile = $(window).width() <= 768;

            if (!isMobile) {
                // Инициализируем книгу только для ПК
                $('#flipbook').turn({
                    width: 900,
                    height: 600,
                    autoCenter: true,
                    duration: 800,
                    gradients: true
                });
            }

            // Навигация для кнопок Назад / Вперед
            $('#prev').click(function() {
                if (isMobile) {
                    var container = document.getElementById('mobileSlider');
                    container.scrollBy({ left: -container.clientWidth, behavior: 'smooth' });
                } else {
                    $('#flipbook').turn('previous');
                }
            });

            $('#next').click(function() {
                if (isMobile) {
                    var container = document.getElementById('mobileSlider');
                    container.scrollBy({ left: container.clientWidth, behavior: 'smooth' });
                } else {
                    $('#flipbook').turn('next');
                }
            });
        });
    </script>

</body>
</html>
