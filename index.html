<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный каталог Мама Знает</title>
    
    <!-- Подключаем jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Подключаем рабочую версию Turn.js через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2c1d11 0%, #1a1008 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .catalog-container {
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* Область флипбука */
        #flipbook {
            width: 900px;
            height: 600px;
        }

        /* Стили отдельных страниц */
        #flipbook .page {
            width: 450px;
            height: 600px;
            background-color: #ffffff;
            background-size: cover;
            background-position: center;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Панель кнопок */
        .controls {
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .controls button {
            background: linear-gradient(135deg, #8c6d53 0%, #684c35 100%);
            color: #ffffff;
            border: 1px solid #aa8769;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .controls button:hover {
            background: linear-gradient(135deg, #a68568 0%, #8c6d53 100%);
            transform: translateY(-2px);
        }

        .controls button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="catalog-container">
        <div id="flipbook">
            <!-- 20 Страниц каталога -->
            <div class="page"><img src="images/page1.jpg" alt="Страница 1"></div>
            <div class="page"><img src="images/page2.jpg" alt="Страница 2"></div>
            <div class="page"><img src="images/page3.jpg" alt="Страница 3"></div>
            <div class="page"><img src="images/page4.jpg" alt="Страница 4"></div>
            <div class="page"><img src="images/page5.jpg" alt="Страница 5"></div>
            <div class="page"><img src="images/page6.jpg" alt="Страница 6"></div>
            <div class="page"><img src="images/page7.jpg" alt="Страница 7"></div>
            <div class="page"><img src="images/page8.jpg" alt="Страница 8"></div>
            <div class="page"><img src="images/page9.jpg" alt="Страница 9"></div>
            <div class="page"><img src="images/page10.jpg" alt="Страница 10"></div>
            <div class="page"><img src="images/page11.jpg" alt="Страница 11"></div>
            <div class="page"><img src="images/page12.jpg" alt="Страница 12"></div>
            <div class="page"><img src="images/page13.jpg" alt="Страница 13"></div>
            <div class="page"><img src="images/page14.jpg" alt="Страница 14"></div>
            <div class="page"><img src="images/page15.jpg" alt="Страница 15"></div>
            <div class="page"><img src="images/page16.jpg" alt="Страница 16"></div>
            <div class="page"><img src="images/page17.jpg" alt="Страница 17"></div>
            <div class="page"><img src="images/page18.jpg" alt="Страница 18"></div>
            <div class="page"><img src="images/page19.jpg" alt="Страница 19"></div>
            <div class="page"><img src="images/page20.jpg" alt="Страница 20"></div>
        </div>
    </div>

    <!-- Кнопки управления -->
    <div class="controls">
        <button id="prev">◄ Назад</button>
        <button id="next">Вперед ►</button>
    </div>

    <script>
        $(document).ready(function() {
            // Инициализация флипбука после полной загрузки DOM
            $('#flipbook').turn({
                width: 900,
                height: 600,
                autoCenter: true,
                duration: 1000,
                gradients: true,
                acceleration: true
            });

            // Навигация кнопками
            $('#prev').click(function() {
                $('#flipbook').turn('previous');
            });

            $('#next').click(function() {
                $('#flipbook').turn('next');
            });

            // Навигация стрелками на клавиатуре
            $(document).keydown(function(e) {
                if (e.keyCode == 37) {
                    $('#flipbook').turn('previous');
                } else if (e.keyCode == 39) {
                    $('#flipbook').turn('next');
                }
            });
        });
    </script>

</body>
</html>
