<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Настройки для красивого превью в WhatsApp и соцсетях -->
    <title>Каталог бытовой химии, духов в Петропавловске</title>
    <meta name="description" content="Каталог бытовой химии и парфюмерии Мама Знает в Петропавловске.">

    <!-- Open Graph метатеги -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Каталог бытовой химии, духов в Петропавловске">
    <meta property="og:description" content="Официальный каталог бытовой химии, парфюмерии и товаров для дома Мама Знает.">
    <meta property="og:image" content="https://suleimanbender-byte.github.io/katalog_1/page1.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">

    <!-- Подключаем jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Подключаем библиотеку Turn.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body {
            background: linear-gradient(135deg, #2c1d11 0%, #1a1008 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .catalog-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Область флипбука */
        #flipbook {
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 6px;
        }

        /* Стили отдельных страниц */
        #flipbook .page {
            background-color: #ffffff;
            background-size: cover;
            background-position: center;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Панель кнопок */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            z-index: 100;
        }

        .controls button {
            background: linear-gradient(135deg, #8c6d53 0%, #684c35 100%);
            color: #ffffff;
            border: 1px solid #aa8769;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .controls button:hover {
            background: linear-gradient(135deg, #a68568 0%, #8c6d53 100%);
        }
    </style>
</head>
<body>

    <div class="catalog-container">
        <div id="flipbook">
            <!-- 20 Страниц каталога -->
            <div class="page"><img src="page1.jpg" alt="Страница 1"></div>
            <div class="page"><img src="page2.jpg" alt="Страница 2"></div>
            <div class="page"><img src="page3.jpg" alt="Страница 3"></div>
            <div class="page"><img src="page4.jpg" alt="Страница 4"></div>
            <div class="page"><img src="page5.jpg" alt="Страница 5"></div>
            <div class="page"><img src="page6.jpg" alt="Страница 6"></div>
            <div class="page"><img src="page7.jpg" alt="Страница 7"></div>
            <div class="page"><img src="page8.jpg" alt="Страница 8"></div>
            <div class="page"><img src="page9.jpg" alt="Страница 9"></div>
            <div class="page"><img src="page10.jpg" alt="Страница 10"></div>
            <div class="page"><img src="page11.jpg" alt="Страница 11"></div>
            <div class="page"><img src="page12.jpg" alt="Страница 12"></div>
            <div class="page"><img src="page13.jpg" alt="Страница 13"></div>
            <div class="page"><img src="page14.jpg" alt="Страница 14"></div>
            <div class="page"><img src="page15.jpg" alt="Страница 15"></div>
            <div class="page"><img src="page16.jpg" alt="Страница 16"></div>
            <div class="page"><img src="page17.jpg" alt="Страница 17"></div>
            <div class="page"><img src="page18.jpg" alt="Страница 18"></div>
            <div class="page"><img src="page19.jpg" alt="Страница 19"></div>
            <div class="page"><img src="page20.jpg" alt="Страница 20"></div>
        </div>
    </div>

    <!-- Кнопки управления -->
    <div class="controls">
        <button id="prev">◄ Назад</button>
        <button id="next">Вперед ►</button>
    </div>

    <script>
        $(document).ready(function() {
            function initCatalog() {
                var windowWidth = $(window).width();
                var bookWidth, bookHeight, displayMode;

                // Проверяем, мобильное ли устройство
                if (windowWidth < 768) {
                    displayMode = 'single';
                    bookWidth = Math.min(windowWidth - 20, 420);
                    bookHeight = bookWidth * 1.414; // Пропорция А5
                } else {
                    displayMode = 'double';
                    bookWidth = 900;
                    bookHeight = 636;
                }

                // Инициализация Turn.js
                $('#flipbook').turn({
                    width: bookWidth,
                    height: bookHeight,
                    display: displayMode,
                    autoCenter: true,
                    duration: 800,
                    gradients: true,
                    acceleration: true
                });
            }

            initCatalog();

            // Навигация кнопками
            $('#prev').click(function() {
                $('#flipbook').turn('previous');
            });

            $('#next').click(function() {
                $('#flipbook').turn('next');
            });

            // Навигация клавишами
            $(document).keydown(function(e) {
                if (e.keyCode == 37) {
                    $('#flipbook').turn('previous');
                } else if (e.keyCode == 39) {
                    $('#flipbook').turn('next');
                }
            });
        });
    </script>

</body>
</html>
